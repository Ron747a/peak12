<html lang="en">

<style>
:root{
  --bg:#0a0d12; --card:#131820; --card2:#1a212b; --line:#232c38;
  --lime:#b4f02c; --text:#eef2f6; --mute:#8b96a5;
  --warn:#f0b429; --warnbg:#2a2110; --blue:#5b9bd5; --refeed:#ff8a3d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  padding-bottom:88px;-webkit-font-smoothing:antialiased;}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 18px 12px;}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.logo{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.logo span{color:var(--lime);}
.phase-pill{background:#1e2a10;color:var(--lime);font-size:11.5px;font-weight:700;
  letter-spacing:.06em;padding:8px 14px;border-radius:20px;text-transform:uppercase;}
.datenav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.navbtn{width:40px;height:40px;flex:none;border-radius:12px;background:var(--card);
  border:1px solid var(--line);color:var(--text);font-size:17px;cursor:pointer;}
.navbtn:disabled{opacity:.3;}
.datewrap{flex:1;text-align:center;}
.datebig{font-size:20px;font-weight:700;letter-spacing:-.01em;}
.datesub{font-size:12.5px;color:var(--mute);margin-top:2px;}
.bar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;}
.bar>div{height:100%;background:var(--lime);border-radius:3px;transition:width .3s;}
.barlbl{text-align:right;font-size:11.5px;color:var(--mute);margin-top:5px;}
.wrap{padding:14px 14px 20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:12px;}
.sec{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-bottom:13px;}
.sec .ico{font-size:15px;}
h3{margin:0 0 6px;font-size:18px;font-weight:700;letter-spacing:-.01em;}
p.body{margin:0;font-size:14px;line-height:1.55;color:var(--mute);}
.banner{border-radius:16px;padding:15px 16px;margin-bottom:12px;border:1px solid;}
.banner.deload{background:var(--warnbg);border-color:#5a4715;}
.banner.deload .t{color:var(--warn);}
.banner.refeed{background:#2a1a10;border-color:#5a3218;}
.banner.refeed .t{color:var(--refeed);}
.banner .t{font-size:15px;font-weight:700;margin-bottom:6px;}
.banner p{margin:0;font-size:13.5px;line-height:1.55;color:#c9b990;}
.banner.refeed p{color:#d6b294;}
.check{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);
  cursor:pointer;align-items:flex-start;}
.check:last-child{border-bottom:none;padding-bottom:0;}
.check:first-of-type{padding-top:0;}
.box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid #33404f;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  color:#0a0d12;font-weight:800;transition:.15s;margin-top:1px;}
.box.on{background:var(--lime);border-color:var(--lime);}
.ctitle{font-size:15.5px;font-weight:600;margin-bottom:3px;line-height:1.3;}
.cdesc{font-size:13.5px;color:var(--mute);line-height:1.5;}
.cmacro{font-size:12.5px;color:#6c7684;margin-top:5px;font-variant-numeric:tabular-nums;}
.done .ctitle,.done .cdesc{opacity:.42;}
.done .ctitle{text-decoration:line-through;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:var(--card2);border-radius:12px;padding:13px;}
.stat .v{font-size:21px;font-weight:700;letter-spacing:-.01em;}
.stat .l{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.4;}
.mstat{background:var(--card2);border-radius:12px;padding:11px 8px;text-align:center;}
.mstat .v{font-size:17px;font-weight:700;color:var(--lime);font-variant-numeric:tabular-nums;}
.mstat .l{font-size:10.5px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums;}
.left{font-size:13.5px;color:var(--mute);margin-top:11px;line-height:1.5;}
.left b{color:var(--text);}
input[type=number]{background:var(--card2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-size:22px;font-weight:700;padding:13px 15px;width:100%;
  font-family:inherit;text-align:center;}
.btn{background:var(--lime);color:#0a0d12;border:none;border-radius:12px;
  padding:14px 22px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;}
.btn.alt{background:var(--card2);color:var(--text);border:1px solid var(--line);}
.row{display:flex;gap:10px;align-items:center;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--mute);padding:8px 3px;border-bottom:1px solid var(--line);font-weight:700;}
td{padding:11px 3px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.num{text-align:right;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,13,18,.96);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:flex;padding:9px 0 max(9px,env(safe-area-inset-bottom));z-index:30;}
nav div{flex:1;text-align:center;padding:7px 0;cursor:pointer;color:var(--mute);}
nav div.on{color:var(--lime);}
nav .ni{font-size:19px;line-height:1;}
nav .nl{font-size:11px;font-weight:600;margin-top:4px;}
.tab{display:none;}
.tab.on{display:block;}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill.ok{background:#1e2a10;color:var(--lime);}
.pill.hi{background:#2a1a10;color:var(--refeed);}
.pill.lo{background:#101f2a;color:var(--blue);}
.pill.no{background:var(--card2);color:var(--mute);}
.shop{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14px;}
.shop:last-child{border-bottom:none;}
.shop .q{color:var(--lime);font-weight:700;font-variant-numeric:tabular-nums;}
.hide{display:none;}
.pgrid{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.pgrid th{padding:7px 1px;text-align:center;font-size:9.5px;color:var(--mute);
  border-bottom:1px solid var(--line);letter-spacing:.03em;}
.pgrid th.nm{text-align:left;width:31%;padding-left:2px;}
.pgrid td{padding:0;border-bottom:1px solid var(--line);text-align:center;height:44px;}
.pgrid td.nm{text-align:left;padding-left:2px;}
.cname{font-weight:600;font-size:13px;line-height:1.25;}
.cnote{font-size:10.5px;color:var(--mute);margin-top:1px;}
.dcell{display:flex;align-items:center;justify-content:center;height:44px;
  font-size:10.5px;font-weight:700;color:var(--lime);cursor:pointer;
  font-variant-numeric:tabular-nums;padding:0 1px;line-height:1.15;word-break:break-word;}
.dcell.empty{color:#2f3a47;font-size:15px;}
.dcell.on{background:#1a2410;}
.dayrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.dayrow:last-child{border-bottom:none;}
.dayrow .dl{width:44px;flex:none;font-size:13px;font-weight:600;color:var(--mute);}
.dayrow input{background:var(--card2);border:1px solid var(--line);border-radius:9px;

  text-align:left;font-weight:500;}
.edithdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px;}
.txtin{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-size:15px;padding:11px 13px;width:100%;font-family:inherit;
  text-align:left;margin-bottom:9px;}
.lnk{color:var(--mute);font-size:12.5px;cursor:pointer;text-decoration:underline;
  background:none;border:none;font-family:inherit;padding:0;}
.dosepill{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);}
.dosepill:last-child{border-bottom:none;}
.dosepill .dn{font-size:14.5px;font-weight:600;}
.dosepill .dd{font-size:14.5px;font-weight:700;color:var(--lime);
  font-variant-numeric:tabular-nums;}
.note{font-size:12.5px;color:#6c7684;line-height:1.55;margin-top:11px;}
</style>
</head>

/* ========= STATE ========= */
let cur=new Date(START+"T00:00:00");
let store={checks:{},weights:{},protocol:null};
let editingId=null;
const DAYNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function defaultProtocol(){
  return [
    {id:'c1',name:'Testosterone E',note:'250mg/wk total',doses:{}},
    {id:'c2',name:'Masteron E',note:'200mg/wk total',doses:{}},
    {id:'c3',name:'Retatrutide',note:'1mg/wk total',doses:{}}
  ];
}
const todayISO=()=>new Date().toISOString().slice(0,10);
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>new Date(s+"T00:00:00");
const dayDiff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);

function load(){
  try{const r=localStorage.getItem('peak8');if(r)store=JSON.parse(r);}catch(e){}
  if(!store.protocol) store.protocol=defaultProtocol();
  const t=todayISO();
  cur = (t>=START&&t<=EVENT)?parse(t):parse(START);
  render();
}
function save(){try{localStorage.setItem('peak8',JSON.stringify(store));}catch(e){}}
function exportData(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='peak8-backup-'+todayISO()+'.json';a.click();
}

function phaseFor(d){
  for(const p of PHASES){if(d>=p.start&&d<=p.end)return p;}
  return d<START?PHASES[0]:PHASES[3];
}
function info(d){
  const date=parse(d), ph=phaseFor(d), dow=date.getDay();
  const sp=SPLIT.find(s=>s.d===dow);
  const isPeak=ph.id==="peak";
  const pk=PEAKDAYS[d]||null;
  const isRefeed=!isPeak&&ph.refeed&&dow===1;
  let key;
  if(isPeak){key=pk?pk.type:null;}
  else if(isRefeed){key="refeed";}
  else{key=ph.id+(sp.train?"_train":"_rest");}
  const wk=Math.floor(dayDiff(d,START)/7)+1;
  return {ph,dow,sp,isPeak,pk,isRefeed,key,wk,
    isDeload:wk===5&&!isPeak,
    dayNum:dayDiff(d,START)+1};
}
function totals(meals){
  return meals.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,fa:a.fa+x.fa}),{k:0,p:0,c:0,fa:0});
}
const R=n=>Math.round(n);

/* ========= RENDER: TODAY ========= */
function render(){
  const d=iso(cur), I=info(d);
  document.getElementById('phasePill').textContent=
    I.isPeak?"PEAK WEEK":`PHASE ${PHASES.indexOf(I.ph)+1} · ${I.ph.name.toUpperCase()}`;

  if(I.isRefeed) h+=`<div class="banner refeed"><div class="t">🍚 Refeed day</div>

      <p class="body">${I.pk.sess}</p>

  } else {
    const train=I.sp.train;
    h+=`<div class="card"><div class="sec"><span class="ico">${train?'🏋️':'🚶'}</span>Today's session</div>
      <h3>${train?I.sp.name:"Recovery day"}</h3>
      <p class="body">${train
        ? (I.isDeload?"Deload — reduced sets, ~70% weight, well short of failure.":"Compounds RPE 8 (2 reps in reserve). Isolation RPE 9. Never to failure on compounds in a deficit.")

    if(train){
      h+=`<table style="margin-top:14px"><tr><th>Exercise</th><th class="num">Sets × Reps</th><th class="num">Rest</th></tr>`;
      SESSIONS[I.sp.name].forEach(e=>{
        h+=`<tr><td><div style="font-weight:600">${e[0]}</div>${e[3]?`<div class="cdesc" style="margin-top:3px">${e[3]}</div>`:''}</td>
          <td class="num">${e[1]}</td><td class="num">${e[2]}</td></tr>`;});
      h+=`</table>`;
    }
    h+=`</div>`;
    h+=`<div class="card"><div class="sec"><span class="ico">🏃</span>Cardio & steps</div>
      ${chk('cardio_'+d,"LISS — "+(I.ph.id==='p1'?'25–30 min':'30–40 min'),"Recovery pace, conversational. Fasted morning walk is ideal.")}

    dt.meals.forEach((x,i)=>{if(store.checks['meal_'+d+'_'+i]){eaten.k+=x.k;eaten.p+=x.p;eaten.c+=x.c;eaten.fa+=x.fa;}});

  } else if(d==="2026-10-03"){
    h+=`<div class="card"><div class="sec"><span class="ico">🍽️</span>Event day food</div>
      <p class="body">Small sips of water only through the morning. 2–4 hrs before: 30–50g carbs if you want extra fullness — 3–4 rice cakes, or 150g cooked white rice, or 2 tbsp honey. No added salt.</p>

  const w = I.isPeak&&I.pk ? I.pk.water : I.ph.water;

  h+=`<div class="card"><div class="sec"><span class="ico">💧</span>Hydration & electrolytes</div>
    <div class="grid2"><div class="stat"><div class="v" style="font-size:17px">${w}</div><div class="l">Water today</div></div>
    <div class="stat"><div class="v" style="font-size:17px">Sodium</div><div class="l">${s}</div></div></div>
    <div class="note">${I.isPeak&&I.pk?(I.pk.note||I.ph.hydNote):I.ph.hydNote} Never exceed 5 L while sodium is restricted.</div></div>`;

  /* protocol due today */
  const due=dosesFor(I.dow);
  if(due.length){
    h+=`<div class="card"><div class="sec"><span class="ico">◆</span>Protocol — ${DAYFULL[I.dow]}</div>`;
    due.forEach((x,i)=>{
      const id='dose_'+d+'_'+i;

      h+=`<div class="check ${on?'done':''}" onclick="tog('${id}')" style="padding:11px 0">
        <div class="box ${on?'on':''}">${on?'✓':''}</div>

    ${chk('mag_'+d,"Magnesium 300–400 mg","Evening. Helps cramping and sleep as the deficit deepens.")}
    ${I.dow===0?chk('photo_'+d,"Weekly photos + waist","Same time of day, same lighting as last week"):''}
  </div>`;

  /* shopping */
  if(I.dow===0||I.dow===3){
    const days=I.dow===0?[1,2,3]:[4,5,6];
    h+=`<div class="card"><div class="sec"><span class="ico">🛒</span>Shopping & prep</div>
      <p class="body" style="margin-bottom:13px">Covers the next ${days.length} days.</p>${shopList(days)}</div>`;

  document.getElementById('todayBody').innerHTML=h;
  renderWeight(); renderPlan(); renderProtocol();
}

function chk(id,title,desc,macro,sub){
  const on=!!store.checks[id];
  return `<div class="check ${on?'done':''}" onclick="tog('${id}')">
    <div class="box ${on?'on':''}">${on?'✓':''}</div>
    <div style="flex:1">
      <div class="ctitle">${title}</div>
      ${sub?`<div class="cdesc" style="color:#6c7684">${sub}</div>`:''}
      ${desc?`<div class="cdesc">${desc}</div>`:''}
      ${macro?`<div class="cmacro">${macro}</div>`:''}
    </div></div>`;
}
function tog(id){store.checks[id]=!store.checks[id];save();render();}
function saveW(){
  const v=parseFloat(document.getElementById('wIn').value);
  if(!v||v<40||v>200)return;
  store.weights[iso(cur)]=v;save();render();
}

function shopList(dows){
  const base=parse(iso(cur));
  const agg={};
  dows.forEach(off=>{
    const dt2=new Date(base);dt2.setDate(dt2.getDate()+(off-base.getDay()+7)%7||7);
    const dd=iso(dt2); if(dd>EVENT)return;
    const I2=info(dd); if(!I2.key)return;
    DAYTYPES[I2.key].meals.forEach(ml=>{
      (ml.items||[]).forEach(([n,q,u])=>{
        const k=n+"|"+u; agg[k]=(agg[k]||0)+q;});});
  });
  const keys=Object.keys(agg);
  if(!keys.length)return `<div class="note">Nothing to shop for.</div>`;
  return keys.map(k=>{
    const [n,u]=k.split("|");
    const q=agg[k];
    return `<div class="shop"><span>${n}</span><span class="q">${q%1?q.toFixed(1):q}${u?' '+u:''}</span></div>`;
  }).join('');
}

/* ========= PROTOCOL TAB ========= */
function pAdd(){
  const id='c'+Date.now();
  store.protocol.push({id,name:'New item',note:'',doses:{}});
  editingId=id;save();render();
}
function pEdit(id){editingId=(editingId===id?null:id);render();}
function pDel(id){
  store.protocol=store.protocol.filter(c=>c.id!==id);
  if(editingId===id)editingId=null;
  save();render();
}
function pSetName(id,v){const c=store.protocol.find(x=>x.id===id);if(c){c.name=v;save();}}
function pSetNote(id,v){const c=store.protocol.find(x=>x.id===id);if(c){c.note=v;save();}}
function pSetDose(id,d,v){
  const c=store.protocol.find(x=>x.id===id);if(!c)return;
  v=v.trim();
  if(v)c.doses[d]=v; else delete c.doses[d];
  save();renderProtocol();renderToday_doses();
}
function pDone(){editingId=null;render();}

function renderProtocol(){
  const P=store.protocol||[];
  let h=`<div class="card">
    <div class="sec"><span class="ico">◆</span>Weekly protocol</div>
    <p class="body" style="margin-bottom:14px">Same schedule every week. Tap any row to edit the name, note and daily doses.</p>`;
  if(!P.length){
    h+=`<p class="body">Nothing added yet.</p>`;
  } else {
    h+=`<table class="pgrid"><tr><th class="nm">Item</th>`;
    [1,2,3,4,5,6,0].forEach(d=>{h+=`<th>${DAYNAMES[d][0]}</th>`;});
    h+=`</tr>`;
    P.forEach(c=>{
      h+=`<tr><td class="nm" onclick="pEdit('${c.id}')">
        <div class="cname">${esc(c.name)}</div>
        ${c.note?`<div class="cnote">${esc(c.note)}</div>`:''}</td>`;
      [1,2,3,4,5,6,0].forEach(d=>{
        const v=c.doses[d];
        h+=`<td onclick="pEdit('${c.id}')"><div class="dcell ${v?'on':'empty'}">${v?esc(v):'·'}</div></td>`;
      });
      h+=`</tr>`;
    });
    h+=`</table>`;
  }
  h+=`<button class="btn alt" style="margin-top:14px" onclick="pAdd()">+ Add item</button></div>`;

  const ed=P.find(c=>c.id===editingId);
  if(ed){
    h+=`<div class="card">
      <div class="edithdr"><div class="sec" style="margin:0">Editing</div>
        <button class="lnk" onclick="pDone()">Done</button></div>
      <input class="txtin" value="${esc(ed.name)}" placeholder="Name"
        oninput="pSetName('${ed.id}',this.value)" onblur="renderProtocol()">
      <input class="txtin" value="${esc(ed.note||'')}" placeholder="Note (optional) — e.g. weekly total"
        oninput="pSetNote('${ed.id}',this.value)" onblur="renderProtocol()">
      <div style="margin-top:6px">`;
    [1,2,3,4,5,6,0].forEach(d=>{
      h+=`<div class="dayrow"><div class="dl">${DAYNAMES[d]}</div>
        <input value="${esc(ed.doses[d]||'')}" placeholder="—"
          onchange="pSetDose('${ed.id}',${d},this.value)"></div>`;
    });
    h+=`</div>
      <button class="lnk" style="margin-top:14px;color:#c25b4a" onclick="pDel('${ed.id}')">Remove this item</button>
    </div>`;
  }

  h+=`<div class="card"><div class="sec">Note</div>
    <p class="body">This is a schedule you fill in yourself — the app just holds it and shows you what's due each day. Keep Dr. Barlow across the full picture, especially before peak week, since the water taper interacts with haematocrit and blood pressure.</p></div>`;

  document.getElementById('protoBody').innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function dosesFor(dow){
  return (store.protocol||[]).filter(c=>c.doses[dow]).map(c=>({n:c.name,d:c.doses[dow]}));
}
function renderToday_doses(){render();}

/* ========= WEIGHT TAB ========= */
function renderWeight(){
  const ws=Object.keys(store.weights).sort().reverse();
  let h="";
  const last7=ws.slice(0,7);
  const avg=last7.length?last7.reduce((a,k)=>a+store.weights[k],0)/last7.length:null;
  const t=todayISO();
  const curWk=WEEKLY.find(w=>t<=w.end)||WEEKLY[6];
  if(avg){
    const diff=avg-curWk.kg;
    const st=diff>0.4?'hi':(diff<-0.4?'lo':'ok');
    const msg={ok:`On pace. Keep everything exactly as it is.`,
      lo:`Ahead of pace by ${Math.abs(diff).toFixed(1)}kg. If training feels flat or lifts drop, add 100–150 kcal of carbs to training days. Losing faster than ~0.8kg/week risks muscle.`,
      hi:`Behind pace by ${diff.toFixed(1)}kg. Add 2,000 steps/day before touching food. Only cut calories if steps haven't fixed it in two weeks.`}[st];
    h+=`<div class="card"><div class="sec">7-day average</div>
      <div style="font-size:38px;font-weight:800;letter-spacing:-.02em">${avg.toFixed(1)} <span style="font-size:20px;color:var(--mute)">kg</span></div>
      <div class="note" style="margin-top:6px">Week ${curWk.w} target: ${curWk.kg}kg · ${ws.length} entries logged</div>
      <div style="margin-top:13px" class="pill ${st}">${st==='ok'?'ON PACE':(st==='lo'?'AHEAD':'BEHIND')}</div>
      <p class="body" style="margin-top:11px">${msg}</p></div>`;
  } else {
    h+=`<div class="card"><p class="body">No weigh-ins logged yet. The whole plan adjusts off your 7-day average — this is the feedback loop that makes it work.</p></div>`;
  }
  h+=`<div class="card"><div class="sec">Week by week</div><table>
    <tr><th>Wk</th><th>Ending</th><th class="num">Target</th><th class="num">Actual</th><th></th></tr>`;
  WEEKLY.forEach(w=>{
    const st2=parse(w.end);st2.setDate(st2.getDate()-6);
    const inW=ws.filter(k=>k>=iso(st2)&&k<=w.end);
    if(!inW.length){
      h+=`<tr><td>${w.w}</td><td>${parse(w.end).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</td>
        <td class="num">${w.kg}</td><td class="num">—</td><td><span class="pill no">—</span></td></tr>`;
    } else {
      const a=inW.reduce((s,k)=>s+store.weights[k],0)/inW.length;
      const df=a-w.kg, sc=df>0.4?'hi':(df<-0.4?'lo':'ok');
      h+=`<tr><td>${w.w}</td><td>${parse(w.end).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</td>
        <td class="num">${w.kg}</td><td class="num" style="color:var(--text);font-weight:600">${a.toFixed(1)}</td>
        <td><span class="pill ${sc}">${sc==='ok'?'ON':(sc==='lo'?'AHEAD':'BEHIND')}</span></td></tr>`;
    }
  });
  h+=`</table><div class="note">Compare 7-day averages, never single days. Daily swings of 1kg+ from water and food volume mean nothing.</div></div>`;
  if(ws.length){
    h+=`<div class="card"><div class="sec">Recent entries</div>`;
    ws.slice(0,14).forEach(k=>{
      h+=`<div class="shop"><span>${parse(k).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</span>
        <span class="q">${store.weights[k].toFixed(1)} kg</span></div>`;});
    h+=`</div>`;
  }
  document.getElementById('weightBody').innerHTML=h;
}

  ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].forEach((n,i)=>{
    const s=SPLIT.find(x=>x.d===i);
    h+=`<tr><td style="font-weight:600">${n}</td><td style="color:${s.train?'var(--text)':'var(--mute)'}">${s.name}</td></tr>`;});
  h+=`</table><div class="note">Chest, shoulders and arms get direct work on both upper days, trained first when you're freshest. Legs run lighter by design — retention, not growth, which frees recovery for the areas that change how you look.</div></div>`;

  h+=`<div class="card"><div class="sec">Peak week</div><table><tr><th>Day</th><th>What happens</th></tr>`;
  Object.keys(PEAKDAYS).forEach(k=>{
    const p=PEAKDAYS[k];
    h+=`<tr><td style="font-weight:600;white-space:nowrap">${parse(k).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</td>
      <td><div style="font-weight:600">${p.lbl}</div><div class="cdesc" style="margin-top:3px">${p.sodium}</div></td></tr>`;});
  h+=`</table><div class="note">Deplete early, refill hard in the last 48 hrs, drop sodium once on the Friday. Don't extend the water cut, don't use diuretics — that's where people actually get hurt, and it doesn't look better. Worth flagging peak week to Dr. Barlow given the compound stack.</div></div>`;

  h+=`<div class="card"><div class="sec">If things drift</div>
    <p class="body"><b style="color:var(--text)">Behind pace:</b> add steps before touching food. 2,000 extra steps ≈ 100 kcal with no recovery cost.<br><br>
    <b style="color:var(--text)">Ahead of pace:</b> add 100–150 kcal of carbs to training days.<br><br>
    <b style="color:var(--text)">Lifts down &gt;10%:</b> the deficit is too aggressive. Add food, don't push harder.<br><br>
    <b style="color:var(--text)">Appetite gone (Retatrutide):</b> tell me early — Phase 3 has almost no buffer built in.</p></div>`;
  h+=`<div class="card"><div class="sec">Backup</div>
    <p class="body" style="margin-bottom:13px">Your data lives on this device only. Export a copy before clearing your browser or switching phones.</p>
    <button class="btn alt" onclick="exportData()">Export my data</button></div>`;
  document.getElementById('planBody').innerHTML=h;
}

/* ========= NAV ========= */
document.getElementById('prev').onclick=()=>{cur.setDate(cur.getDate()-1);render();};
document.getElementById('next').onclick=()=>{cur.setDate(cur.getDate()+1);render();};
document.querySelectorAll('nav div').forEach(n=>{
  n.onclick=()=>{
    document.querySelectorAll('nav div').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    n.classList.add('on');
    document.getElementById('tab'+n.dataset.tab).classList.add('on');
    window.scrollTo(0,0);
  };
});
load();
</script>
</body>
</html>
